<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase - Juan Hendrawan</title>
    <link rel="icon" type="image/png" href="/assets/images/camera.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <a href="index.html" class="logo">Juan Hendrawan</a>
            <nav>
                <ul>
                    <li><a href="about.html">About Me</a></li>
                    <li><a href="showcase.html" class="active">Showcase</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="showcase-page">
        <div class="container">
            <h1>Project Showcase</h1>
            <p class="subtitle">Explore my photography and videography portfolio</p>
            
            <!-- Filter Bar -->
            <div class="filter-card">
                <div class="filter-controls">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Search projects...">
                    </div>
                    
                    <div class="filter-select">
                        <select id="type-filter">
                            <option value="">All Types</option>
                            <option value="photo">Photo</option>
                            <option value="video">Video</option>
                        </select>
                    </div>
                    
                    <div class="filter-select">
                        <select id="category-filter">
                            <option value="">All Categories</option>
                            <option value="portrait">Portrait</option>
                            <option value="landscape">Landscape</option>
                            <option value="street">Street</option>
                            <option value="wedding">Wedding</option>
                            <option value="product">Product</option>
                            <option value="arsitektur">Arsitektur</option>
                            <option value="event">Event</option>
                            <option value="documentary">Documentary</option>
                            <option value="shortfilm">Short Film</option>
                            <option value="commercial">Commercial</option>
                        </select>
                    </div>
                    
                    <button id="clear-filters" class="btn secondary">Clear</button>
                </div>
                
                <div class="filter-status">
                    <div id="active-filters" class="active-filters">
                        <!-- Active filters will appear here -->
                    </div>
                    <div id="results-count" class="results-count">
                        Loading projects...
                    </div>
                </div>
            </div>
            
            <!-- Projects Grid -->
            <div class="projects-grid" id="projects-grid">
                <!-- Projects will be populated by JavaScript -->
            </div>
            
            <!-- Pagination -->
            <div class="pagination-container">
                <div class="pagination" id="pagination">
                    <!-- Pagination buttons will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-columns">
                <div class="footer-column">
                    <h4>Contact Info</h4>
                     <p>
                        <i class="fas fa-envelope"></i>
                        <a href="mailto:juanhendrawan6@gmail.com" target="_blank" rel="noopener noreferrer">juanhendrawan6@gmail.com</a>

                    </p>
                </div>
                <div class="footer-column">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About Me</a></li>
                        <li><a href="showcase.html">Showcase</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h4>Follow Me</h4>
                    <div class="social-links">
                        <a href="https://www.instagram.com/juanhendrawan?igsh=MzQzZXFtODgzb280" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
                        <a href="https://www.youtube.com/@byjuanhendrawan" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i></a>
                        <a href="https://x.com/_juanhendrawan" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
                        <a href="https://www.linkedin.com/in/juanhendrawan?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023 Juan Hendrawan. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
    <script src="assets/js/project.js"></script>
</body>
</html>
